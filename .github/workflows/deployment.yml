# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Deploy Chisa Discord Bot to VPS

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build image and upload it to VPS
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/arm64
        push: true
        tags: taufiq30s/chisa:latest

    - name: Prepare deploy directory on VPS
      uses: appleboy/ssh-action@v1
      env:
        CHISA_PATH: ${{ secrets.CHISA_PATH }}
      with:
        host: ${{ secrets.VPS_HOST }}
        port: ${{ secrets.VPS_PORT }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_KEY }}
        envs: CHISA_PATH
        script: |
          set -eu

          test -n "${CHISA_PATH:-}" || { echo "CHISA_PATH secret is empty"; exit 1; }

          # scp-action untars as VPS_USERNAME, so a directory owned by root gives
          # `tar: docker-compose.yml: Cannot open: Permission denied`. Docker
          # creates ./logs in here too, which root owns for the same reason.
          mkdir -p "$CHISA_PATH"
          if [ ! -w "$CHISA_PATH" ]; then
            if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
              sudo -n chown "$(id -u):$(id -g)" "$CHISA_PATH"
            else
              echo "CHISA_PATH=$CHISA_PATH is not writable by $(id -un)" >&2
              echo "fix on the VPS: sudo chown $(id -un) '$CHISA_PATH'" >&2
              exit 1
            fi
          fi

          touch "$CHISA_PATH/.write-check" && rm -f "$CHISA_PATH/.write-check"

    - name: Copy compose file to VPS
      uses: appleboy/scp-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        port: ${{ secrets.VPS_PORT }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_KEY }}
        source: docker-compose.yml
        target: ${{ secrets.CHISA_PATH }}
        # Never `rm: true`: that directory also holds the live .env.
        overwrite: true

    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1
      env:
        CHISA_PATH: ${{ secrets.CHISA_PATH }}
      with:
        host: ${{ secrets.VPS_HOST }}
        port: ${{ secrets.VPS_PORT }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_KEY }}
        envs: CHISA_PATH
        script: |
          # ssh-action v1 dropped `script_stop`; set -e replaces it.
          set -eu

          test -n "${CHISA_PATH:-}" || { echo "CHISA_PATH secret is empty"; exit 1; }
          cd "$CHISA_PATH"

          # Both the .env mount and env_file: resolve relative to this file, and
          # godotenv.Load() exits on a missing .env.
          test -f .env || { echo "missing $(pwd)/.env"; exit 1; }

          if docker compose version >/dev/null 2>&1; then DC="docker compose"
          elif command -v docker-compose >/dev/null 2>&1; then DC="docker-compose"
          else echo "no docker compose plugin on host"; exit 1
          fi

          # Earlier releases started the bot with `docker run --name chisa-dc`,
          # which owns the name compose now wants for the same container.
          docker rm -f chisa-dc 2>/dev/null || true

          $DC pull
          $DC up -d --remove-orphans
          docker image prune -f

          # Fail the workflow instead of leaving a dead bot behind. A restart
          # loop also reports State.Running=true, so watch RestartCount too:
          # godotenv exits on a missing .env and compose restarts it forever.
          sleep 10
          $DC ps
          state=$(docker inspect -f '{{.State.Running}} {{.RestartCount}}' chisa-dc)
          echo "state=$state"
          test "$state" = "true 0"

